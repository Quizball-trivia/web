name: indexnow

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Backfill every sitemap URL (normally only new or changed ones are sent)
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: github.repository == 'Quizball-trivia/web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-state-
      - run: node scripts/indexnow-submit.mjs --state .indexnow/state.json ${{ inputs.all && '--all' || '' }}
      - uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
